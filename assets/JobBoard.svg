<svg width="600" height="260" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
  <title>OnlyNerds — Job Board Feature</title>
  <rect width="600" height="260" rx="20" fill="#000000"/>

  <!-- Left Side: {Job} -->
  <text x="65" y="145"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="70"
        fill="#FF7A00"
        font-weight="300">
    {<tspan fill="#FFFFFF" font-weight="900" letter-spacing="-2">J</tspan><tspan fill="#FFFFFF" font-weight="400" letter-spacing="-2">ob</tspan>}
  </text>

  <!-- Center Separator: | -->
  <text x="265" y="145"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="80"
        font-weight="200"
        fill="#1DA1F2">|</text>

  <!-- Right Side: <Board> -->
  <text x="315" y="145"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="70"
        fill="#FF7A00"
        font-weight="300">
    &lt;<tspan fill="#FFFFFF" font-weight="900" letter-spacing="-2">B</tspan><tspan fill="#FFFFFF" font-weight="400" letter-spacing="-2">oard</tspan>&gt;
  </text>
</svg>
